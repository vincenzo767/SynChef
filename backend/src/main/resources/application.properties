# ─────────────────────────────────────────────────────────────────────────────
# SynChef API configuration.
# Every secret is read from the environment. For local development, put values
# in backend/.env (git-ignored) — it is imported below as a properties file.
# See backend/.env.example for the full list.
# ─────────────────────────────────────────────────────────────────────────────
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}
spring.application.name=synchef-backend
server.error.include-stacktrace=never
server.error.include-message=never
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:none}

# ─── Database ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/SynChef}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

# JPA / Hibernate. Schema evolution is additive (ddl-auto=update) plus the
# versioned, idempotent data migrations in config/migration.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Jackson — ISO-8601 dates, tolerate unknown properties from older clients.
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

# ─── Authentication / sessions ──────────────────────────────────────────────
# Opaque session token in an HttpOnly cookie, hashed at rest (user_sessions table).
app.security.session-cookie-name=SYNCHEF_SESSION
app.security.cookie-secure=${APP_COOKIE_SECURE:true}
app.security.cookie-same-site=${APP_COOKIE_SAME_SITE:Lax}
app.security.session-ttl=${APP_SESSION_TTL:P7D}
app.security.session-idle-timeout=${APP_SESSION_IDLE_TIMEOUT:PT48H}
app.security.login-rate-limit=${APP_LOGIN_RATE_LIMIT:10}
app.security.login-rate-window=${APP_LOGIN_RATE_WINDOW:PT5M}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app.google.client-id=${GOOGLE_CLIENT_ID:}

# Optional bootstrap administrator (created only when both values are set).
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}

# ─── AI assistant (optional) ────────────────────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.7

# ─── Logging ────────────────────────────────────────────────────────────────
logging.level.edu.cit.batawang.synchef=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=INFO

# ─── Uploads ────────────────────────────────────────────────────────────────
app.upload.dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
