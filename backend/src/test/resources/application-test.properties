# In-memory database for automated tests (PostgreSQL compatibility mode).
spring.datasource.url=jdbc:h2:mem:synchef-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.security.cookie-secure=true
app.security.login-rate-limit=5
app.upload.dir=target/test-uploads
app.admin.email=admin@test.local
app.admin.password=AdminTestPassword!1
app.google.client-id=
spring.ai.openai.api-key=not-configured
logging.level.edu.cit.batawang.synchef=WARN
