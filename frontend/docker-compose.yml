# Local full-stack run: PostgreSQL + Spring Boot API + nginx-served SPA on http://localhost:3000
# Secrets come from frontend/.env (copy frontend/.env.example). Never commit real values.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: synchef
      POSTGRES_USER: ${POSTGRES_USER:-synchef}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in frontend/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synchef}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/synchef
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-synchef}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # Plain http on localhost in this compose file; set true behind HTTPS.
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      SERVER_FORWARD_HEADERS_STRATEGY: native
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  uploads:
